<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OSH Day 2026 Hospital Sri Aman - Spin the Wheel</title>
    <!-- Include Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Tone.js for browser-based audio synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Include Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --grid-color: rgba(0, 240, 255, 0.05);
            --primary-cyan: #00F0FF;
            --primary-blue: #0057FF;
            --primary-purple: #8A2BE2;
            --glass-bg: rgba(10, 15, 30, 0.7);
            --glass-border: rgba(0, 240, 255, 0.2);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #ffffff;
            min-height: 100dvh; /* Updated for mobile browsers */
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            overscroll-behavior: none; /* Prevents pull-to-refresh bounce on mobile */
            -webkit-tap-highlight-color: transparent; /* Removes blue tap flash on iOS */
            user-select: none; /* Prevents accidental text selection while tapping */
            -webkit-user-select: none;
        }

        /* Radial ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120vw; height: 120vw;
            max-width: 1200px; max-height: 1200px;
            background: radial-gradient(circle, rgba(0, 87, 255, 0.12) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Montserrat', sans-serif;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 550px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 50%;
            padding: 10px; /* Reduced for better fit on small mobile screens */
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 87, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transition: transform 5s cubic-bezier(0.1, 0.9, 0.2, 1);
            border: 3px solid var(--primary-cyan);
            box-sizing: border-box;
            background: #000;
        }

        .pointer-container {
            position: absolute;
            top: -10px; /* Adjusted for mobile */
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 0 15px var(--primary-cyan));
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 18px solid transparent; /* Scaled down for mobile */
            border-right: 18px solid transparent;
            border-top: 45px solid var(--primary-cyan);
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; /* Scaled down for mobile */
            height: 70px;
            background: #030712;
            border-radius: 50%;
            border: 4px solid var(--primary-cyan);
            z-index: 10;
            box-shadow: 0 0 25px var(--primary-cyan), inset 0 0 15px rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-dot::after {
            content: 'OSH';
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem; /* Scaled down for mobile */
            color: var(--primary-cyan);
            text-shadow: 0 0 10px var(--primary-cyan);
            letter-spacing: 2px;
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            opacity: 0;
            z-index: 50;
            animation: fall 4s ease-in infinite;
        }

        @keyframes fall {
            0% { opacity: 1; transform: translateY(-10vh) rotate(0deg) scale(1); }
            100% { opacity: 1; transform: translateY(100vh) rotate(720deg) scale(0.5); }
        }

        .modal-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--primary-cyan);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.15), inset 0 0 30px rgba(0, 240, 255, 0.05);
        }

        .btn-spin {
            background: linear-gradient(135deg, rgba(0, 87, 255, 0.8), rgba(0, 240, 255, 0.8));
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-spin:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(255,255,255,0.5);
            border-color: #fff;
            transform: translateY(-3px) scale(1.02);
            background: linear-gradient(135deg, rgba(0, 87, 255, 1), rgba(0, 240, 255, 1));
        }
        
        .btn-spin:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-spin:disabled {
            background: #111827;
            box-shadow: none;
            border-color: #374151;
            color: #4b5563;
        }

        #resultModal {
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="text-slate-200">

    <header class="w-full p-4 sm:p-6 flex justify-between items-center absolute top-0 z-30 pointer-events-none">
        <div class="ml-auto pointer-events-auto">
            <button id="toggleAudioBtn" class="bg-cyan-950/40 hover:bg-cyan-900/60 text-cyan-500 hover:text-cyan-300 border border-cyan-800/50 p-3 rounded-full shadow-[0_0_15px_rgba(0,240,255,0.1)] backdrop-blur-md transition-all duration-300 flex items-center justify-center" title="Toggle Audio">
                <svg id="audioIconOff" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                <svg id="audioIconOn" class="w-6 h-6 hidden text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                <span id="audioText" class="hidden">Audio Off</span>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center w-full px-4 pt-20 pb-8 relative z-10">
        
        <!-- Branding -->
        <div class="text-center mb-6 sm:mb-10 w-full max-w-3xl">
            <h2 class="text-sm sm:text-lg md:text-2xl font-black text-cyan-400 font-heading tracking-[0.3em] uppercase mb-1 sm:mb-2 drop-shadow-[0_0_8px_rgba(0,240,255,0.4)]">OSH Day 2026</h2>
            <h1 class="text-2xl sm:text-4xl md:text-5xl lg:text-6xl font-black text-white font-heading tracking-widest drop-shadow-[0_0_20px_rgba(0,240,255,0.3)]">HOSPITAL SRI AMAN</h1>
            <div class="w-16 sm:w-24 h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent mx-auto mt-4 sm:mt-6 opacity-80"></div>
        </div>
        
        <!-- Wheel -->
        <div class="wheel-container mb-8 sm:mb-12">
            <div class="pointer-container">
                <div class="pointer"></div>
            </div>
            <!-- High resolution canvas for sharp rendering -->
            <canvas id="wheelCanvas" width="800" height="800"></canvas>
            <div class="center-dot"></div>
        </div>

        <!-- Spin Controls -->
        <button id="spinBtn" class="btn-spin relative group w-full max-w-[280px] sm:max-w-sm text-xl sm:text-2xl font-black py-4 px-8 sm:px-12 rounded-full flex items-center justify-center gap-3 sm:gap-4 font-heading tracking-widest uppercase z-20 mx-auto touch-manipulation">
            <svg class="w-6 h-6 sm:w-8 sm:h-8 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="spinIcon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            SPIN
            <!-- Subtle futuristic shine effect -->
            <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-shimmer z-0 rounded-full"></div>
        </button>
        
        <p id="statusMsg" class="mt-6 text-cyan-500 font-bold text-sm tracking-[0.2em] uppercase opacity-70 transition-all">
            SYSTEM READY
        </p>

    </main>

    <!-- Winner Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4 opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="modal-glass rounded-[2rem] sm:rounded-[2.5rem] p-6 sm:p-10 max-w-lg w-full text-center transform scale-95 transition-all duration-500 ease-out relative overflow-hidden" id="modalContent">
            
            <div id="modalConfetti" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

            <div class="relative z-10 flex flex-col items-center">
                <p class="text-cyan-400 text-xs sm:text-sm font-bold tracking-[0.4em] uppercase mb-2 sm:mb-3">YOUR RESULT</p>
                <div class="w-12 sm:w-16 h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent mb-6 sm:mb-10"></div>
                
                <div class="w-full bg-black/40 border border-cyan-500/20 rounded-2xl sm:rounded-3xl p-6 sm:p-10 mb-8 sm:mb-10 shadow-[inset_0_0_30px_rgba(0,240,255,0.05)]">
                    <span id="winningItemText" class="text-3xl sm:text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-blue-400 break-words leading-tight drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">Prize Name</span>
                </div>
                
                <button id="closeModalBtn" class="w-full inline-flex justify-center items-center gap-2 rounded-xl sm:rounded-2xl bg-cyan-900/40 border border-cyan-500/50 px-6 sm:px-8 py-3 sm:py-4 text-base sm:text-lg font-bold text-cyan-50 shadow-[0_0_20px_rgba(0,240,255,0.15)] hover:bg-cyan-800/60 hover:border-cyan-300 hover:shadow-[0_0_30px_rgba(0,240,255,0.3)] focus:outline-none transition-all duration-300 transform hover:-translate-y-1 tracking-[0.2em] uppercase touch-manipulation">
                    ACCEPT
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let gifts = [
                "Keychain",
                "Tote Bag - Cat",
                "Bottle",
                "Tote Bag - Pink Panda",
                "Keychain",
                "Mug",
                "Tote Bag - Small Red Bag",
                "Umbrella",
                "Keychain",
                "Notebook",
                "Tote Bag - Gouzi",
                "Small Towel",
                "Tote Bag - Pink",
                "Keychain",
                "Car Refreshener",
                "Tote Bag - Big",
                "First Aid Bag"
            ];
            
            // Premium futuristic color palette (Deep Navies, Cyans, Purples, Electric Blues)
            const colors = [
                '#001B3D', // Dark Blue
                '#003F8A', // Deep Blue
                '#0057FF', // Electric Blue
                '#00F0FF', // Cyan
                '#4CC9F0', // Light Blue
                '#7B2CBF', // Purple
                '#3A0CA3', // Dark Purple
                '#1D3557', // Slate Blue
                '#00B4D8'  // Ocean Blue
            ];

            let currentRotation = 0;
            let isSpinning = false;
            let canvas = document.getElementById('wheelCanvas');
            let ctx = canvas.getContext('2d');

            const spinBtn = document.getElementById('spinBtn');
            const spinIcon = document.getElementById('spinIcon');
            const resultModal = document.getElementById('resultModal');
            const winningItemText = document.getElementById('winningItemText');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const statusMsg = document.getElementById('statusMsg');
            const toggleAudioBtn = document.getElementById('toggleAudioBtn');
            const audioIconOff = document.getElementById('audioIconOff');
            const audioIconOn = document.getElementById('audioIconOn');
            const audioText = document.getElementById('audioText');

            // --- AUDIO SYSTEM (Tone.js) ---
            let isAudioInitialized = false;
            let bgmSynth, tickSynth, winSynth;
            let bgmLoop;
            let isAudioPlaying = false;
            let tickInterval;

            async function initAudio() {
                if (isAudioInitialized) return;
                await Tone.start();
                Tone.Transport.bpm.value = 130; // Faster, festive tempo

                // Background Music Synth - upbeat and bouncy
                bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.5 }
                }).toDestination();
                bgmSynth.volume.value = -18; // Quiet ambient background

                // Ticking Synth for wheel spin mechanics (Snappy clack sound)
                tickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 }
                }).toDestination();
                tickSynth.volume.value = -8;

                // Winning Fanfare Synth - Bright, celebratory chords
                winSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle", spread: 20 },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 1.5 }
                }).toDestination();
                winSynth.volume.value = -8;

                // Create a bouncy, festive loop for the background
                const notes = ["C5", "G4", "E5", "C5", "D5", "G4", "F5", "D5"];
                let step = 0;
                bgmLoop = new Tone.Loop((time) => {
                    bgmSynth.triggerAttackRelease(notes[step % notes.length], "16n", time);
                    step++;
                }, "8n");

                isAudioInitialized = true;
            }

            async function toggleAudio() {
                if (!isAudioInitialized) {
                    await initAudio();
                    startAudio();
                } else {
                    if (isAudioPlaying) {
                        stopAudio();
                    } else {
                        startAudio();
                    }
                }
            }

            function startAudio() {
                Tone.Transport.start();
                bgmLoop.start(0);
                isAudioPlaying = true;
                audioIconOff.classList.add('hidden');
                audioIconOn.classList.remove('hidden');
                audioText.textContent = "Audio On";
                toggleAudioBtn.classList.replace('bg-white/10', 'bg-cyan-500');
                toggleAudioBtn.classList.replace('border-white/30', 'border-cyan-300');
            }

            function stopAudio() {
                Tone.Transport.pause();
                bgmLoop.stop();
                isAudioPlaying = false;
                audioIconOn.classList.add('hidden');
                audioIconOff.classList.remove('hidden');
                audioText.textContent = "Audio Off";
                toggleAudioBtn.classList.replace('bg-cyan-500', 'bg-white/10');
                toggleAudioBtn.classList.replace('border-cyan-300', 'border-white/30');
            }

            function playTick() {
                if (isAudioInitialized && tickSynth) {
                    tickSynth.triggerAttackRelease("C4", "64n");
                }
            }

            function playWinFanfare() {
                if (isAudioInitialized && winSynth) {
                    const now = Tone.now();
                    // Play a classic triumphant sequence
                    winSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                    winSynth.triggerAttackRelease(["E4", "G4", "C5"], "8n", now + 0.15);
                    winSynth.triggerAttackRelease(["G4", "C5", "E5"], "8n", now + 0.3);
                    winSynth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n", now + 0.45);
                }
            }
            
            toggleAudioBtn.addEventListener('click', toggleAudio);
            // --- END AUDIO SYSTEM ---

            function updateUI() {
                spinBtn.disabled = false;
                statusMsg.textContent = "SYSTEM READY";
                statusMsg.className = "mt-6 text-cyan-500 font-bold text-sm tracking-[0.2em] uppercase opacity-70 transition-all drop-shadow-[0_0_5px_rgba(0,240,255,0.3)]";
                
                drawWheel();
            }

            function drawWheel() {
                const scale = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                
                if(rect.width === 0) return;

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const sliceAngle = (2 * Math.PI) / gifts.length;

                for (let i = 0; i < gifts.length; i++) {
                    const startAngle = i * sliceAngle;
                    const endAngle = (i + 1) * sliceAngle;

                    // Draw Slice
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();
                    
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    
                    // Tech-style crisp separator lines
                    ctx.strokeStyle = '#00F0FF';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Inner dimensional highlight
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius - 15, startAngle, endAngle);
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
                    ctx.lineWidth = 6;
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + sliceAngle / 2);
                    
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#ffffff';
                    
                    let fontSize = 42; // Base size increased for better legibility when shrunk via CSS
                    if (gifts.length > 8) fontSize = 34;
                    if (gifts.length > 12) fontSize = 26;
                    
                    ctx.font = `800 ${fontSize}px Montserrat, sans-serif`;
                    
                    // Dark theme heavy drop shadow for legibility
                    ctx.shadowColor = 'rgba(0,0,0,0.9)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 3;
                    ctx.shadowOffsetY = 3;

                    let text = gifts[i];
                    const maxTextWidth = radius - 110; // Adjusted for new font size
                    
                    if (ctx.measureText(text).width > maxTextWidth) {
                        while (ctx.measureText(text + '...').width > maxTextWidth && text.length > 0) {
                            text = text.slice(0, -1);
                        }
                        text += '...';
                    }

                    ctx.fillText(text, radius - 55, fontSize/3); // Adjusted padding from edge
                    ctx.restore();
                }

                // Tech outer glowing ring
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 3, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
                ctx.lineWidth = 6;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 8, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            async function spin() {
                if (isSpinning || gifts.length === 0) return;
                
                if (!isAudioInitialized) {
                    await initAudio();
                }
                
                isSpinning = true;
                spinBtn.disabled = true;
                spinIcon.classList.add('animate-spin');
                
                statusMsg.innerHTML = '<span class="inline-block w-2 h-2 mr-2 bg-cyan-400 rounded-full animate-ping"></span> SPINNING...';
                statusMsg.className = "mt-6 text-cyan-300 font-bold text-sm tracking-[0.3em] uppercase transition-all drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]";
                
                const spins = 6;
                const randomDegrees = Math.floor(Math.random() * 360);
                const totalRotation = (spins * 360) + randomDegrees;
                
                currentRotation += totalRotation;

                canvas.style.transform = `rotate(${currentRotation}deg)`;

                let tickDelay = 30; 
                const maxDelay = 350; 
                
                const doTick = () => {
                    if (!isSpinning) return;
                    playTick();
                    tickDelay = tickDelay * 1.05; 
                    if (tickDelay < maxDelay) {
                        tickInterval = setTimeout(doTick, tickDelay);
                    }
                };
                doTick();

                setTimeout(() => {
                    clearTimeout(tickInterval);
                    determineWinner();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinIcon.classList.remove('animate-spin');
                    
                    statusMsg.textContent = "SYSTEM READY";
                    statusMsg.className = "mt-6 text-cyan-500 font-bold text-sm tracking-[0.2em] uppercase opacity-70 transition-all drop-shadow-[0_0_5px_rgba(0,240,255,0.3)]";
                }, 5000);
            }

            function determineWinner() {
                const actualRotation = currentRotation % 360;
                const sliceAngle = 360 / gifts.length;
                
                let pointerAngle = (360 - actualRotation + 270) % 360;
                
                let winningIndex = Math.floor(pointerAngle / sliceAngle);
                
                if (winningIndex >= gifts.length) winningIndex = 0;
                if (winningIndex < 0) winningIndex = 0;

                const winner = gifts[winningIndex];
                showResult(winner);
            }

            function showResult(winner) {
                winningItemText.textContent = winner;
                
                resultModal.classList.remove('hidden');
                
                void resultModal.offsetWidth;
                
                resultModal.classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('modalContent').classList.remove('scale-95');
                document.getElementById('modalContent').classList.add('scale-100');
                
                fireConfetti();
                playWinFanfare();
            }

            function closeResult() {
                resultModal.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('modalContent').classList.remove('scale-100');
                document.getElementById('modalContent').classList.add('scale-95');
                
                setTimeout(() => {
                    resultModal.classList.add('hidden');
                    document.getElementById('modalConfetti').innerHTML = ''; 
                }, 500);
            }

            function fireConfetti() {
                const container = document.getElementById('modalConfetti');
                // Tech themed confetti colors
                const confettiColors = ['#00F0FF', '#0057FF', '#8A2BE2', '#4CC9F0', '#ffffff'];
                
                for (let i = 0; i < 80; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    const left = Math.random() * 100;
                    confetti.style.left = `${left}%`;
                    confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                    confetti.style.animationDelay = `${Math.random() * 2}s`;
                    confetti.style.animationDuration = `${3 + Math.random() * 2}s`;
                    
                    const shapeType = Math.random();
                    if (shapeType > 0.6) {
                        confetti.style.borderRadius = '50%';
                        confetti.style.width = '10px';
                        confetti.style.height = '10px';
                    } else if (shapeType > 0.3) {
                        confetti.style.width = '6px';
                        confetti.style.height = '18px';
                    }
                    
                    confetti.style.boxShadow = `0 0 10px ${confetti.style.backgroundColor}`;
                    
                    container.appendChild(confetti);
                }
            }

            spinBtn.addEventListener('click', spin);
            closeModalBtn.addEventListener('click', closeResult);
            
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes shimmer {
                    100% { transform: translateX(100%); }
                }
                .animate-shimmer {
                    animation: shimmer 2s infinite;
                }
                .animate-spin {
                    animation: spin 1s linear infinite;
                }
                @keyframes spin {
                    from { transform: rotate(0deg); }
                    to { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);

            window.addEventListener('resize', () => {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(() => {
                    drawWheel();
                }, 100);
            });

            document.fonts.ready.then(() => {
                updateUI();
                setTimeout(drawWheel, 100); 
            });
        });
    </script>
</body>
</html>
