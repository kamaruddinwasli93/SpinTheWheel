<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OSH Day 2026 Hospital Sri Aman</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050B14;
            --bg-grid: rgba(0, 240, 255, 0.03);
            --neon-cyan: #00F0FF;
            --neon-blue: #0057FF;
            --neon-purple: #8A2BE2;
            --glass-bg: rgba(5, 11, 20, 0.6);
            --glass-border: rgba(0, 240, 255, 0.2);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-deep);
            color: #ffffff;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-select: none;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Tech Grid Background */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -2;
        }

        /* Ambient glowing orbs in the background */
        body::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vw;
            max-width: 800px; max-height: 800px;
            background: radial-gradient(circle, rgba(0, 87, 255, 0.15) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        h1, h2, .font-tech {
            font-family: 'Orbitron', sans-serif;
        }

        .wheel-wrapper {
            position: relative;
            width: 90vw;
            max-width: 550px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            box-shadow: 0 0 50px rgba(0, 87, 255, 0.2), inset 0 0 30px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            transition: transform 5s cubic-bezier(0.1, 0.9, 0.15, 1);
            border: 4px solid var(--neon-cyan);
            background: #000;
        }

        /* Tech Pointer Arrow */
        .pointer-container {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 0 12px var(--neon-cyan));
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 50px solid var(--neon-cyan);
        }

        /* Center Hub */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18%;
            aspect-ratio: 1 / 1;
            background: #050B14;
            border-radius: 50%;
            border: 3px solid var(--neon-cyan);
            z-index: 10;
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 10px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-dot::after {
            content: 'OSH';
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(14px, 3vw, 24px);
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            letter-spacing: 1px;
        }

        .btn-spin {
            background: linear-gradient(135deg, rgba(0, 87, 255, 0.8), rgba(0, 240, 255, 0.8));
            color: #fff;
            border: 2px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease-out;
            touch-action: manipulation;
        }

        @media (hover: hover) {
            .btn-spin:hover:not(:disabled) {
                box-shadow: 0 0 50px rgba(0, 240, 255, 0.8), inset 0 0 20px rgba(255,255,255,0.4);
                transform: translateY(-2px) scale(1.02);
                border-color: #fff;
            }
        }
        
        .btn-spin:active:not(:disabled) {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-spin:disabled {
            background: rgba(20, 30, 50, 0.8);
            box-shadow: none;
            border-color: #1a2a40;
            color: #4b5563;
            transform: none;
        }

        .glass-panel {
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 80px rgba(0, 240, 255, 0.2), inset 0 0 40px rgba(0, 240, 255, 0.1);
        }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            opacity: 0; z-index: 50;
            animation: fall 3s ease-in infinite;
        }

        @keyframes fall {
            0% { opacity: 1; transform: translateY(-50px) rotate(0deg); }
            100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
        }

        /* Management Panel Styles */
        #managePanel {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
        .prize-item {
            transition: all 0.2s;
        }
        .prize-item:hover {
            background-color: rgba(0, 240, 255, 0.1);
        }
        
        /* Custom Scrollbar for Management List */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.6); 
        }
    </style>
</head>
<body>

    <!-- Top Right Controls -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-30 flex gap-3">
        <!-- Settings Toggle (Manage Prizes) -->
        <button id="toggleManageBtn" class="bg-blue-950/50 hover:bg-blue-900/80 text-cyan-400 border border-cyan-800/50 p-3 rounded-full shadow-[0_0_15px_rgba(0,240,255,0.15)] backdrop-blur-md transition-all duration-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>

        <!-- Audio Toggle -->
        <button id="toggleAudioBtn" class="bg-blue-950/50 hover:bg-blue-900/80 text-cyan-400 border border-cyan-800/50 p-3 rounded-full shadow-[0_0_15px_rgba(0,240,255,0.15)] backdrop-blur-md transition-all duration-300">
            <svg id="audioIconOff" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
            <svg id="audioIconOn" class="w-6 h-6 hidden text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
        </button>
    </div>

    <!-- Main Content Container -->
    <main class="flex-grow flex flex-col items-center justify-center w-full px-4 relative z-10" id="mainGame">
        
        <!-- Headers -->
        <div class="text-center mb-6 sm:mb-8 w-full">
            <h2 class="text-xs sm:text-sm md:text-base font-bold text-cyan-400 font-tech tracking-[0.4em] uppercase mb-2 drop-shadow-[0_0_8px_rgba(0,240,255,0.6)]">OSH Day 2026</h2>
            <h1 class="text-2xl sm:text-4xl md:text-5xl lg:text-5xl font-black text-white font-tech tracking-widest drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">HOSPITAL SRI AMAN</h1>
        </div>
        
        <!-- The Wheel -->
        <div class="wheel-wrapper mb-8 sm:mb-10">
            <div class="pointer-container">
                <div class="pointer"></div>
            </div>
            <canvas id="wheelCanvas" width="900" height="900"></canvas>
            <div class="center-dot"></div>
        </div>

        <!-- Spin Controls -->
        <button id="spinBtn" class="btn-spin w-full max-w-[280px] sm:max-w-[360px] text-2xl sm:text-3xl font-black py-4 sm:py-5 px-8 rounded-full flex items-center justify-center gap-4 font-tech tracking-widest uppercase z-20 overflow-hidden relative">
            <svg class="w-8 h-8 opacity-90 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="spinIcon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span class="relative z-10">SPIN NOW</span>
        </button>
        
        <p id="statusMsg" class="mt-6 text-cyan-500 font-bold text-xs sm:text-sm tracking-[0.3em] font-tech uppercase opacity-60">
            SYSTEM READY
        </p>
    </main>

    <!-- Manage Prizes Panel (Hidden by default) -->
    <div id="managePanel" class="fixed inset-0 bg-black/95 backdrop-blur-3xl z-40 flex flex-col pt-24 pb-8 px-4 sm:px-8 opacity-0 pointer-events-none transform translate-y-4">
        <div class="w-full max-w-2xl mx-auto flex flex-col h-full">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-tech font-bold text-white tracking-wider">MANAGE PRIZES</h2>
                    <p class="text-cyan-500 text-sm mt-1">Remove items that are out of stock.</p>
                </div>
                <button id="closeManageBtn" class="text-cyan-500 hover:text-white transition-colors">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="glass-panel flex-grow rounded-2xl p-4 overflow-hidden flex flex-col">
                <div class="flex justify-between text-xs font-bold text-cyan-600 tracking-widest uppercase mb-4 px-2 border-b border-cyan-900/50 pb-2">
                    <span>Active Prizes on Wheel (<span id="prizeCount"></span>)</span>
                    <span>Action</span>
                </div>
                
                <div id="prizeListContainer" class="flex-grow overflow-y-auto pr-2 space-y-2">
                    <!-- Prize items will be injected here via JS -->
                </div>
                
                <div class="mt-4 pt-4 border-t border-cyan-900/50 text-center">
                    <button id="resetPrizesBtn" class="text-xs text-red-400 hover:text-red-300 uppercase tracking-widest border border-red-900/50 hover:bg-red-900/20 py-2 px-4 rounded-full transition-colors">
                        Reset to Original 17 Items
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden flex items-center justify-center z-50 p-4 opacity-0 pointer-events-none transition-opacity duration-500">
        <div id="modalConfetti" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
        
        <div class="glass-panel rounded-3xl p-8 sm:p-12 max-w-lg w-full text-center transform scale-90 transition-all duration-500 ease-out relative z-10" id="modalContent">
            
            <p class="text-cyan-400 text-sm sm:text-base font-bold font-tech tracking-[0.5em] uppercase mb-4">SYSTEM SELECTED</p>
            
            <div class="w-full bg-black/60 border border-cyan-500/30 rounded-2xl p-8 mb-8 shadow-[inset_0_0_40px_rgba(0,240,255,0.1)] relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent via-cyan-400/10 to-transparent w-full h-[200%] animate-[scan_3s_linear_infinite] pointer-events-none"></div>
                <span id="winningItemText" class="relative z-10 text-3xl sm:text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-200 to-white leading-tight font-tech drop-shadow-[0_0_15px_rgba(0,240,255,0.5)]">Prize</span>
            </div>
            
            <button id="closeModalBtn" class="w-full rounded-full bg-cyan-950/60 border border-cyan-500 py-4 text-lg sm:text-xl font-bold font-tech text-white shadow-[0_0_20px_rgba(0,240,255,0.2)] hover:bg-cyan-900 hover:shadow-[0_0_30px_rgba(0,240,255,0.5)] transition-all uppercase tracking-[0.2em]">
                ACCEPT PRIZE
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // The Original Set of 17 Items
            const initialGifts = [
                "Keychain",
                "Tote Bag - Cat",
                "Bottle",
                "Keychain",
                "Notebook",
                "Tote Bag - Pink Panda",
                "Mug",
                "Keychain",
                "Small Towel",
                "Tote Bag - Small Red Bag",
                "Umbrella",
                "Keychain",
                "Tote Bag - Gouzi",
                "Car Refreshener",
                "Tote Bag - Pink",
                "First Aid Bag",
                "Tote Bag - Big"
            ];
            
            // Working list that can be modified
            let activeGifts = [...initialGifts];
            
            const colorPalette = [
                '#001B3D', '#003F8A', '#0057FF', '#0F4C81', 
                '#00F0FF', '#4CC9F0', '#7B2CBF', '#3A0CA3', 
                '#1D3557', '#00B4D8'
            ];

            let currentRotation = 0;
            let isSpinning = false;
            let canvas = document.getElementById('wheelCanvas');
            let ctx = canvas.getContext('2d');

            const spinBtn = document.getElementById('spinBtn');
            const spinIcon = document.getElementById('spinIcon');
            const resultModal = document.getElementById('resultModal');
            const winningItemText = document.getElementById('winningItemText');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const statusMsg = document.getElementById('statusMsg');
            const toggleAudioBtn = document.getElementById('toggleAudioBtn');
            
            const toggleManageBtn = document.getElementById('toggleManageBtn');
            const closeManageBtn = document.getElementById('closeManageBtn');
            const managePanel = document.getElementById('managePanel');
            const prizeListContainer = document.getElementById('prizeListContainer');
            const prizeCount = document.getElementById('prizeCount');
            const resetPrizesBtn = document.getElementById('resetPrizesBtn');

            let isAudioInitialized = false;
            let bgmSynth, tickSynth, winSynth, bgmLoop;
            let isAudioPlaying = false;
            let tickInterval;

            async function initAudio() {
                if (isAudioInitialized) return;
                await Tone.start();
                Tone.Transport.bpm.value = 130; 

                bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.1, decay: 0.1, sustain: 0.3, release: 1 }
                }).toDestination();
                bgmSynth.volume.value = -20; 

                tickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 2,
                    oscillator: { type: "square" },
                    envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 }
                }).toDestination();
                tickSynth.volume.value = -10;

                winSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle", spread: 10 },
                    envelope: { attack: 0.05, decay: 0.3, sustain: 0.4, release: 2 }
                }).toDestination();
                winSynth.volume.value = -8;

                const notes = ["C4", "G3", "E4", "C4"];
                let step = 0;
                bgmLoop = new Tone.Loop((time) => {
                    bgmSynth.triggerAttackRelease(notes[step % notes.length], "8n", time);
                    step++;
                }, "4n");

                isAudioInitialized = true;
            }

            function toggleAudio() {
                if (!isAudioInitialized) {
                    initAudio().then(() => {
                        Tone.Transport.start();
                        bgmLoop.start(0);
                        isAudioPlaying = true;
                        updateAudioUI();
                    });
                } else {
                    if (isAudioPlaying) {
                        Tone.Transport.pause();
                        bgmLoop.stop();
                        isAudioPlaying = false;
                    } else {
                        Tone.Transport.start();
                        bgmLoop.start(0);
                        isAudioPlaying = true;
                    }
                    updateAudioUI();
                }
            }

            function updateAudioUI() {
                const offIcon = document.getElementById('audioIconOff');
                const onIcon = document.getElementById('audioIconOn');
                if (isAudioPlaying) {
                    offIcon.classList.add('hidden');
                    onIcon.classList.remove('hidden');
                    toggleAudioBtn.classList.replace('bg-blue-950/50', 'bg-cyan-600/80');
                    toggleAudioBtn.classList.replace('border-cyan-800/50', 'border-cyan-300');
                } else {
                    onIcon.classList.add('hidden');
                    offIcon.classList.remove('hidden');
                    toggleAudioBtn.classList.replace('bg-cyan-600/80', 'bg-blue-950/50');
                    toggleAudioBtn.classList.replace('border-cyan-300', 'border-cyan-800/50');
                }
            }

            function drawWheel() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (activeGifts.length === 0) {
                    ctx.fillStyle = '#050B14';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#00F0FF';
                    ctx.font = '800 40px Montserrat';
                    ctx.textAlign = 'center';
                    ctx.fillText('ALL PRIZES CLAIMED', centerX, centerY - 50);
                    return;
                }

                const sliceAngle = (2 * Math.PI) / activeGifts.length;

                for (let i = 0; i < activeGifts.length; i++) {
                    const startAngle = i * sliceAngle;
                    const endAngle = (i + 1) * sliceAngle;

                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();
                    // Ensure colors loop predictably
                    ctx.fillStyle = colorPalette[i % colorPalette.length];
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + sliceAngle / 2);
                    
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffffff';
                    
                    // Dynamic font size based on slice count
                    let baseFontSize = activeGifts.length > 10 ? 28 : 40;
                    ctx.font = `800 ${baseFontSize}px Montserrat, sans-serif`; 
                    
                    ctx.shadowColor = 'rgba(0,0,0,0.9)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;

                    let text = activeGifts[i];
                    const maxTextWidth = radius - 130; 
                    
                    if (ctx.measureText(text).width > maxTextWidth) {
                        while (ctx.measureText(text + '...').width > maxTextWidth && text.length > 0) {
                            text = text.slice(0, -1);
                        }
                        text += '...';
                    }

                    ctx.fillText(text, radius - 40, 0); 
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 15, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            async function spin() {
                if (isSpinning || activeGifts.length === 0) return;
                
                if (!isAudioInitialized) {
                    await initAudio();
                }
                
                isSpinning = true;
                spinBtn.disabled = true;
                
                spinIcon.classList.add('animate-[spin_1s_linear_infinite]');
                statusMsg.innerHTML = '<span class="inline-block w-2 h-2 mr-2 bg-cyan-400 rounded-full animate-ping"></span> CALCULATING RESULT...';
                statusMsg.classList.add('text-cyan-300', 'drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]');
                
                const baseSpins = 5 + Math.floor(Math.random() * 3);
                const randomDegrees = Math.floor(Math.random() * 360);
                const totalRotation = (baseSpins * 360) + randomDegrees;
                
                currentRotation += totalRotation;
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                let tickDelay = 20; 
                const maxDelay = 400; 
                
                const doTick = () => {
                    if (!isSpinning) return;
                    if (isAudioInitialized && tickSynth) tickSynth.triggerAttackRelease("C4", "32n");
                    
                    tickDelay = tickDelay * 1.06; 
                    if (tickDelay < maxDelay) {
                        tickInterval = setTimeout(doTick, tickDelay);
                    }
                };
                doTick();

                setTimeout(() => {
                    clearTimeout(tickInterval);
                    determineWinner();
                    isSpinning = false;
                    spinBtn.disabled = activeGifts.length === 0;
                    spinIcon.classList.remove('animate-[spin_1s_linear_infinite]');
                    
                    statusMsg.textContent = activeGifts.length > 0 ? "SYSTEM READY" : "OUT OF PRIZES";
                    statusMsg.classList.remove('text-cyan-300', 'drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]');
                }, 5000); 
            }

            function determineWinner() {
                const actualRotation = currentRotation % 360;
                const sliceAngle = 360 / activeGifts.length;
                let pointerAngle = (360 - actualRotation + 270) % 360;
                
                let winningIndex = Math.floor(pointerAngle / sliceAngle);
                
                if (winningIndex >= activeGifts.length) winningIndex = 0;
                if (winningIndex < 0) winningIndex = 0;

                showResult(activeGifts[winningIndex]);
            }

            function showResult(winner) {
                winningItemText.textContent = winner;
                
                resultModal.classList.remove('hidden');
                void resultModal.offsetWidth;
                
                resultModal.classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('modalContent').classList.remove('scale-90');
                document.getElementById('modalContent').classList.add('scale-100');
                
                createConfetti();
                
                if (isAudioInitialized && winSynth) {
                    const now = Tone.now();
                    winSynth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                    winSynth.triggerAttackRelease(["C6", "E6"], "2n", now + 0.2);
                }
            }

            function closeResult() {
                resultModal.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('modalContent').classList.remove('scale-100');
                document.getElementById('modalContent').classList.add('scale-90');
                
                setTimeout(() => {
                    resultModal.classList.add('hidden');
                    document.getElementById('modalConfetti').innerHTML = ''; 
                }, 500);
            }

            function createConfetti() {
                const container = document.getElementById('modalConfetti');
                const confettiColors = ['#00F0FF', '#0057FF', '#8A2BE2', '#FFFFFF'];
                
                for (let i = 0; i < 60; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                    confetti.style.animationDelay = `${Math.random() * 1}s`;
                    confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
                    confetti.style.boxShadow = `0 0 10px ${confetti.style.backgroundColor}`;
                    container.appendChild(confetti);
                }
            }

            function renderManageList() {
                prizeListContainer.innerHTML = '';
                prizeCount.textContent = activeGifts.length;
                
                if (activeGifts.length === 0) {
                    prizeListContainer.innerHTML = '<div class="text-center text-cyan-600/50 py-8 italic font-tech">No prizes remaining.</div>';
                    spinBtn.disabled = true;
                } else {
                    spinBtn.disabled = false;
                }

                activeGifts.forEach((prize, index) => {
                    const el = document.createElement('div');
                    el.className = 'prize-item flex justify-between items-center bg-cyan-950/30 border border-cyan-800/30 rounded-lg p-3';
                    
                    const name = document.createElement('span');
                    name.className = 'text-cyan-50 font-bold';
                    name.textContent = prize;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'text-red-400 hover:text-red-300 hover:bg-red-900/40 p-2 rounded-md transition-colors';
                    removeBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                    
                    removeBtn.onclick = () => removePrize(index);

                    el.appendChild(name);
                    el.appendChild(removeBtn);
                    prizeListContainer.appendChild(el);
                });
            }

            function removePrize(index) {
                activeGifts.splice(index, 1);
                renderManageList();
                drawWheel();
            }

            function toggleManagePanel() {
                const isHidden = managePanel.classList.contains('opacity-0');
                if (isHidden) {
                    renderManageList();
                    managePanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                    managePanel.classList.add('translate-y-0');
                } else {
                    managePanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                    managePanel.classList.remove('translate-y-0');
                }
            }

            function resetPrizes() {
                activeGifts = [...initialGifts];
                renderManageList();
                drawWheel();
            }

            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes scan {
                    0% { transform: translateY(-50%); }
                    100% { transform: translateY(0%); }
                }
            `;
            document.head.appendChild(style);

            // Bind Events
            spinBtn.addEventListener('click', spin);
            closeModalBtn.addEventListener('click', closeResult);
            toggleAudioBtn.addEventListener('click', toggleAudio);
            toggleManageBtn.addEventListener('click', toggleManagePanel);
            closeManageBtn.addEventListener('click', toggleManagePanel);
            resetPrizesBtn.addEventListener('click', resetPrizes);

            // Initial render
            document.fonts.ready.then(() => {
                drawWheel();
            });
            
            window.addEventListener('resize', () => {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(drawWheel, 150);
            });
        });
    </script>
</body>
</html>
